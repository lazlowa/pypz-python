name: "Publish Artifact"
description: "This action builds and publishes artifacts to PyPi"

inputs:
  path:
    required: true
    description: "Path to the project, where pyproject.toml resides"

runs:
  using: composite
  steps:
    - name: Validate
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v python >/dev/null 2>&1; then
          echo "::error::Python is not installed or not available on PATH."
          exit 1
        fi

        python --version
        python -m pip install --upgrade pip

        if ! python -m build --version >/dev/null 2>&1; then
          echo "Python module 'build' is not installed. Installing it..."
          python -m pip install --upgrade build
        fi

        python -m build --version

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        python -m build ${{ inputs.path }}