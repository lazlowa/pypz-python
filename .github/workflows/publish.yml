name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  discover_packages:
    name: Discover Python packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Discover packages
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          packages = []

          for pyproject in sorted(root.glob("**/pyproject.toml")):
              if pyproject.parent == root:
                  continue

              data = tomllib.loads(pyproject.read_text())
              project = data.get("project", {})
              name = project.get("name")

              # Only include actual Python distributions.
              if not name:
                  continue

              packages.append({
                  "name": name,
                  "path": f"./{pyproject.parent}",
              })

          if not packages:
              raise SystemExit("No publishable packages found")

          print("matrix=" + json.dumps(packages, separators=(",", ":")))
          PY

      - name: Show discovered matrix
        run: echo '${{ steps.discover.outputs.matrix }}'

  publish_artifacts:
    needs: discover_packages
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover_packages.outputs.matrix) }}

    environment:
      name: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build

      - name: Build ${{ matrix.package.name }}
        shell: bash
        run: |
          set -euo pipefail
          python -m build "${{ matrix.package.path }}"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package.path }}/dist
          repository-url: ${{ vars.PYPI_REPOSITORY_URL }}

      - name: Store Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: ${{ matrix.package.path }}/dist/

  publish_docker:
    needs: publish_artifacts
    name: "Publish Docker Image :: ${{ matrix.revision }}"
    runs-on: ubuntu-latest
    environment: test
    strategy:
      fail-fast: false
      matrix:
        revision:
          - dev
          - alpine
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Derive version from tag
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${GITHUB_REF_NAME#v}"

        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)?$ ]]; then
          echo "::error::Invalid version derived from tag: $GITHUB_REF_NAME -> $VERSION"
          exit 1
        fi

        echo "PYPZ_VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Retrieve Artifacts
      uses: actions/download-artifact@v8
      with:
        name: artifacts
        path: dist/
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: .docker/Dockerfile_${{ matrix.revision }}
        push: true
        tags: |
          pypz/${{ vars.DOCKER_IMAGE_NAME_PREFIX }}-${{ matrix.revision }}:latest
          pypz/${{ vars.DOCKER_IMAGE_NAME_PREFIX }}-${{ matrix.revision }}:${{ env.PYPZ_VERSION }}
