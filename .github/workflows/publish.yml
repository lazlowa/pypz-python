name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  discover_packages:
    name: Discover Python packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Discover packages
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          packages = []

          for pyproject in sorted(root.glob("**/pyproject.toml")):
              if pyproject.parent == root:
                  continue

              data = tomllib.loads(pyproject.read_text())
              project = data.get("project", {})
              name = project.get("name")

              # Only include actual Python distributions.
              if not name:
                  continue

              packages.append({
                  "name": name,
                  "path": f"./{pyproject.parent}",
              })

          if not packages:
              raise SystemExit("No publishable packages found")

          print("matrix=" + json.dumps(packages, separators=(",", ":")))
          PY

      - name: Show discovered matrix
        run: echo '${{ steps.discover.outputs.matrix }}'

  publish_artifacts:
    needs: discover_packages
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover_packages.outputs.matrix) }}

    environment:
      name: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build

      - name: Build ${{ matrix.package.name }}
        shell: bash
        run: |
          set -euo pipefail
          python -m build "${{ matrix.package.path }}"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package.path }}/dist
          repository-url: ${{ vars.PYPI_REPOSITORY_URL }}

      - name: Store Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: ${{ matrix.package.path }}/dist/

  publish_docker:
    needs: publish_artifacts
    name: "Publish Docker Image :: ${{ matrix.revision }}"
    runs-on: ubuntu-latest
    environment: test
    strategy:
      fail-fast: false
      matrix:
        revision:
          - dev
          - alpine
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Derive version from tag
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${GITHUB_REF_NAME#v}"

        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)?$ ]]; then
          echo "::error::Invalid version derived from tag: $GITHUB_REF_NAME -> $VERSION"
          exit 1
        fi

        echo "PYPZ_VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Retrieve Artifacts
      uses: actions/download-artifact@v8
      with:
        name: artifacts
        path: dist/
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: .docker/Dockerfile_${{ matrix.revision }}
        push: true
        tags: |
          pypz/${{ vars.DOCKER_IMAGE_NAME_PREFIX }}-${{ matrix.revision }}:latest
          pypz/${{ vars.DOCKER_IMAGE_NAME_PREFIX }}-${{ matrix.revision }}:${{ env.PYPZ_VERSION }}

  build_docs:
    needs: discover_packages
    name: "Build Docs"
    runs-on: ubuntu-latest
    environment: test

    permissions:
      contents: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    env:
      PACKAGES_JSON: ${{ needs.discover_packages.outputs.packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r ./docs/requirements.txt

      - name: Install discovered packages in editable mode
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import subprocess
          import sys

          packages = json.loads(os.environ["PACKAGES_JSON"])

          for package in packages:
              name = package["name"]
              path = package["path"]

              print(f"Installing {name} from {path} in editable mode")
              subprocess.check_call([
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "-e",
                  path,
              ])
          PY

      - name: Show resolved version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pypz.version import PROJECT_VERSION
          print(PROJECT_VERSION)
          PY

      - name: Build Indexes
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          packages = json.loads(os.environ["PACKAGES_JSON"])

          for package in packages:
              name = package["name"]
              source = pathlib.Path(package["source"])
              docs_index = pathlib.Path(package["docs_index"])

              if not source.exists():
                  print(f"Skipping {name}: source path does not exist: {source}")
                  continue

              docs_index.mkdir(parents=True, exist_ok=True)

              print(f"Building Sphinx API index for {name}")
              subprocess.check_call([
                  "sphinx-apidoc",
                  "--implicit-namespaces",
                  "-e",
                  "-f",
                  "--private",
                  "-o",
                  str(docs_index),
                  str(source),
              ])
          PY

      - name: Build HTML
        shell: bash
        run: |
          set -euo pipefail
          sphinx-build ./docs ./docs/_build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/_build

  publish_docs:
    needs: build_docs
    name: "Publish Docs"
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
