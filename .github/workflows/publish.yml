name: "Publish :: Core"

on:
  push:
    tags:
      - "v*"

jobs:
  core:
    name: "Publish Core"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Publish
      uses: ./.github/actions/publish
      with:
        path: ./core
