name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: pypz-core
            path: ./core
            pypi-url: https://pypi.org/p/pypz-core
          - name: pypz-k8s-deployer
            path: ./deployers/k8s
            pypi-url: https://pypi.org/p/pypz-kafka-io
          - name: pypz-kafka-io
            path: ./plugins/kafka_io
            pypi-url: https://pypi.org/p/pypz-kafka-io
          - name: pypz-rmq-io
            path: ./plugins/rmq_io
            pypi-url: https://pypi.org/p/pypz-rmq-io
          - name: pypz-io-sniffer
            path: ./sniffer
            pypi-url: https://pypi.org/p/pypz-rmq-io

    environment:
      name: test
      url: ${{ matrix.package.pypi-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build

      - name: Build ${{ matrix.package.name }}
        shell: bash
        run: |
          set -euo pipefail
          python -m build "${{ matrix.package.path }}"
