name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: pypz-core
            path: ./core
          - name: pypz-k8s-deployer
            path: ./deployers/k8s
          - name: pypz-kafka-io
            path: ./plugins/kafka_io
          - name: pypz-rmq-io
            path: ./plugins/rmq_io
          - name: pypz-io-sniffer
            path: ./sniffer

    environment:
      name: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build

      - name: Build ${{ matrix.package.name }}
        shell: bash
        run: |
          set -euo pipefail
          python -m build "${{ matrix.package.path }}"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package.path }}/dist
          repository-url: ${{ env.PYPI_REPOSITORY_URL }}/
