name: "Publish :: Docs"

on: push

env:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.130"

jobs:
  discover_packages:
    name: Discover Python packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Discover packages
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          packages = []

          for pyproject in sorted(root.glob("**/pyproject.toml")):
              if pyproject.parent == root:
                  continue

              data = tomllib.loads(pyproject.read_text())
              project = data.get("project", {})
              name = project.get("name")

              if not name:
                  continue

              path = pyproject.parent

              packages.append({
                  "name": name,
                  "path": f"./{path}",
                  "source": f"./{path}/src/pypz",
                  "docs_index": f"./docs/indexes/{path}",
              })

          if not packages:
              raise SystemExit("No publishable packages found")

          print("packages=" + json.dumps(packages, separators=(",", ":")))
          PY

      - name: Show discovered packages
        run: echo '${{ steps.discover.outputs.packages }}'

  build:
    needs: discover_packages
    name: "Build"
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: write

    env:
      PACKAGES_JSON: ${{ needs.discover_packages.outputs.packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pyyaml
          python -m pip install -r requirements.txt
          python -m pip install -r ./docs/requirements.txt

      - name: Install discovered packages in editable mode
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import subprocess
          import sys

          packages = json.loads(os.environ["PACKAGES_JSON"])

          for package in packages:
              name = package["name"]
              path = package["path"]

              print(f"Installing {name} from {path} in editable mode")
              subprocess.check_call([
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "-e",
                  path,
              ])
          PY

      - name: Build Indexes
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          packages = json.loads(os.environ["PACKAGES_JSON"])

          for package in packages:
              name = package["name"]
              source = pathlib.Path(package["source"])
              docs_index = pathlib.Path(package["docs_index"])

              if not source.exists():
                  print(f"Skipping {name}: source path does not exist: {source}")
                  continue

              docs_index.mkdir(parents=True, exist_ok=True)

              print(f"Building Sphinx API index for {name}")
              subprocess.check_call([
                  "sphinx-apidoc",
                  "--implicit-namespaces",
                  "-e",
                  "-f",
                  "--private",
                  "-o",
                  str(docs_index),
                  str(source),
              ])
          PY

      - name: Build HTML
        shell: bash
        run: |
          set -euo pipefail
          sphinx-build ./docs ./docs/_build
